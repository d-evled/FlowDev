# Sample: Cloud Run service with Managed Service for Prometheus sidecar.
# Replace ALL placeholders, then:
#   gcloud run services replace cloud-run-with-gmp-sidecar.sample.yaml --region REGION
#
# Official docs (keep in sync with Google’s current sidecar image tag):
# https://docs.cloud.google.com/stackdriver/docs/managed-prometheus/cloudrun-sidecar
#
# Placeholders:
#   SERVICE_NAME       e.g. flowdev-service
#   APP_IMAGE          full Artifact Registry URI for your app image (same as CI pushes)
#   COLLECTOR_IMAGE    e.g. us-docker.pkg.dev/cloud-ops-agents-artifacts/cloud-run-gmp-sidecar/cloud-run-gmp-sidecar:1.2.0
#
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: SERVICE_NAME
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        # Collector starts after the app container; shuts down before app.
        run.googleapis.com/container-dependencies: '{"collector":["app"]}'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        # MUST be named "app" for the dependency annotation above.
        - name: app
          image: APP_IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: READY
              value: "true"
        - name: collector
          image: COLLECTOR_IMAGE
